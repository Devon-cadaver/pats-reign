<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Pats Reign Showcase</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1a26; font-family: Georgia, 'Times New Roman', serif; color: #f2e6c8; touch-action: none; }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
    #bar { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0); padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 5px; background: linear-gradient(#0008, #0000); z-index: 2; }
    #bar button { font: 700 12px Georgia, serif; color: #f2e6c8; background: #2a1c12cc; border: 1.5px solid #c8a24a; border-radius: 6px; padding: 5px 8px; }
    #bar button.on { background: #c8a24a; color: #1a120a; }
    #label { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0)); text-align: center; font-size: 20px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 2px 6px #000; pointer-events: none; }
    #label small { display: block; font-size: 13px; opacity: .85; font-weight: 400; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="bar"></div>
  <div id="label"></div>
  <script type="module" src="./src/showcase.js"></script>
</body>
</html>
