<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Valhalla's Tide: a longship riding a curling wave beneath the sun -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c0"/><stop offset=".5" stop-color="#e6b43a"/><stop offset="1" stop-color="#9a5e12"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd8e8"/><stop offset=".45" stop-color="#2a8fb0"/><stop offset="1" stop-color="#0f3a5c"/></linearGradient>
    <linearGradient id="sail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c8322a"/><stop offset=".5" stop-color="#f2e6c8"/><stop offset="1" stop-color="#c8322a"/></linearGradient>
    <radialGradient id="sky" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#2a4a7a"/><stop offset="1" stop-color="#070b16"/></radialGradient>
    <clipPath id="disc"><circle cx="100" cy="100" r="98"/></clipPath>
  </defs>
  <g id="bg"><circle cx="100" cy="100" r="98" fill="url(#sky)"/><circle cx="100" cy="100" r="96" fill="none" stroke="url(#gold)" stroke-width="3"/></g>
