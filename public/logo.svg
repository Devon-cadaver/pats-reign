      <path d="M46 70c8-2 12 4 10 10-2 5-8 6-12 2 4 0 7-3 6-6-1-3-4-4-7-3z" fill="#e6b43a"/>
      <path d="M158 120c10-8 14-22 8-38-2-6-6-10-12-12" fill="none" stroke="#3a2410" stroke-width="7" stroke-linecap="round"/>
      <path d="M154 70c-8-2-12 4-10 10 2 5 8 6 12 2-4 0-7-3-6-6 1-3 4-4 7-3z" fill="#e6b43a"/>
      <g fill="#c8322a" stroke="#f2e6c8" stroke-width="1.5">
        <circle cx="62" cy="120" r="5"/><circle cx="76" cy="122" r="5"/><circle cx="90" cy="123" r="5"/><circle cx="104" cy="123" r="5"/><circle cx="118" cy="122" r="5"/><circle cx="132" cy="120" r="5"/>
      </g>
      <g fill="#e6b43a"><circle cx="62" cy="120" r="1.6"/><circle cx="76" cy="122" r="1.6"/><circle cx="90" cy="123" r="1.6"/><circle cx="104" cy="123" r="1.6"/><circle cx="118" cy="122" r="1.6"/><circle cx="132" cy="120" r="1.6"/></g>
      <rect x="98" y="46" width="4" height="74" fill="#3a2410"/>
      <path d="M68 56h64" stroke="#3a2410" stroke-width="4" stroke-linecap="round"/>
      <path d="M72 58h56v44c-10-6-18-8-28-8s-18 2-28 8z" fill="url(#sail)"/>
      <path d="M72 58h56v44c-10-6-18-8-28-8s-18 2-28 8z" fill="none" stroke="#3a2410" stroke-width="2"/>
